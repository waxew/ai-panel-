# AI-PANEL-FA-INLINE-GUIDE
# راهنما: کامنت‌های فارسی نقش گزینه یا دستور بعدی را توضیح می‌دهند.
# راهنما: این گزینه «services» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
services:
  # راهنما: این گزینه «postgres» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  postgres:
    # راهنما: این گزینه «image» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    image: postgres:16-alpine
    # راهنما: این گزینه «environment» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    environment:
      # راهنما: این گزینه «POSTGRES_DB» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
      POSTGRES_DB: ai_panel
      # راهنما: این گزینه «POSTGRES_USER» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
      POSTGRES_USER: ai_panel
      # راهنما: این گزینه «POSTGRES_PASSWORD» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
      POSTGRES_PASSWORD: ai_panel
    # راهنما: این گزینه «ports» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    ports:
      # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
      - "5432:5432"
    # راهنما: این گزینه «volumes» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    volumes:
      # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
      - postgres_data:/var/lib/postgresql/data

  # راهنما: این گزینه «redis» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  redis:
    # راهنما: این گزینه «image» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    image: redis:7-alpine
    # راهنما: این گزینه «ports» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    ports:
      # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
      - "6379:6379"
    # راهنما: این گزینه «volumes» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
    volumes:
      # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
      - redis_data:/data

# راهنما: این گزینه «volumes» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
volumes:
  # راهنما: این گزینه «postgres_data» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  postgres_data:
  # راهنما: این گزینه «redis_data» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  redis_data:
