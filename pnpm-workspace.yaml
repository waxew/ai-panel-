# AI-PANEL-FA-INLINE-GUIDE
# راهنما: کامنت‌های فارسی نقش گزینه یا دستور بعدی را توضیح می‌دهند.
# راهنما: این گزینه «packages» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
packages:
  # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
  - apps/*
  # راهنما: این آیتم یکی از اعضای لیست تنظیمات این بخش است.
  - packages/*

# راهنما: این گزینه «allowBuilds» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
allowBuilds:
  # راهنما: این خط بخشی از تنظیمات این فایل است و رفتار ابزار مربوط را مشخص می‌کند.
  '@prisma/engines': true
  # راهنما: این گزینه «esbuild» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  esbuild: true
  # راهنما: این گزینه «prisma» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  prisma: true
  # راهنما: این گزینه «workerd» یک مقدار تنظیماتی برای ابزار/سرویس این فایل تعیین می‌کند.
  workerd: true
