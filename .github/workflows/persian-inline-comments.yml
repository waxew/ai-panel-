name: Persian inline code documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/persian-inline-comments.yml'
      - 'scripts/add-persian-inline-comments.mjs'

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install TypeScript parser only
        shell: bash
        run: |
          mkdir -p scripts/.fa-doc-tool
          npm install --prefix scripts/.fa-doc-tool --no-package-lock --ignore-scripts typescript@5.9.2
          ln -s "$GITHUB_WORKSPACE/scripts/.fa-doc-tool/node_modules" "$GITHUB_WORKSPACE/scripts/node_modules"

      - name: Add Persian explanations to source files
        run: node scripts/add-persian-inline-comments.mjs

      - name: Remove temporary documentation tooling
        shell: bash
        run: |
          rm -rf scripts/.fa-doc-tool scripts/node_modules
          rm -f package-lock.json
          git restore .github/workflows/cloudflare-preview.yml

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "ai-panel-doc-bot"
          git config user.email "ai-panel-doc-bot@users.noreply.github.com"
          git add apps packages prisma supabase .env.example .gitignore docker-compose.yml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: add Persian inline code explanations [fa-comments]"
          git push
