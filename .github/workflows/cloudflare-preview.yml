name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-preview.yml
      - package.json
      - pnpm-workspace.yaml
      - packages/shared/**
      - apps/cloudflare/**
      - apps/web/**

permissions:
  contents: read

concurrency:
  group: ai-panel-cloudflare-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @ai-panel/shared build

      - name: Build web app
        run: pnpm build:cloudflare

      - name: Deploy production
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ai-panel/cloudflare exec wrangler deploy

      - name: Smoke production
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL=https://ai-panel-demo.bustling-larch.workers.dev

          health_ok=false
          for attempt in $(seq 1 15); do
            health_status=$(curl --silent --show-error --output /tmp/production-health.json --write-out '%{http_code}' \
              "$BASE_URL/health" || true)
            if [ "$health_status" = "200" ] && grep -q '"ok":true' /tmp/production-health.json; then
              health_ok=true
              break
            fi
            echo "Production health smoke attempt $attempt returned HTTP $health_status"
            cat /tmp/production-health.json || true
            sleep 2
          done
          test "$health_ok" = "true"

          session_ok=false
          for attempt in $(seq 1 15); do
            status=$(curl --silent --show-error --output /tmp/production-session.json --write-out '%{http_code}' \
              "$BASE_URL/api/session" || true)
            if [ "$status" = "401" ] && grep -q '"authenticated":false' /tmp/production-session.json; then
              session_ok=true
              break
            fi
            echo "Production session smoke attempt $attempt returned HTTP $status"
            cat /tmp/production-session.json || true
            sleep 2
          done
          test "$session_ok" = "true"

      - name: Deploy temporary preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-panel/cloudflare exec wrangler deploy --temporary 2>&1 | tee /tmp/wrangler-preview.log
          preview_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -n 1)
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Smoke temporary preview
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail

          health_ok=false
          for attempt in $(seq 1 30); do
            health_status=$(curl --silent --show-error --output /tmp/preview-health.json --write-out '%{http_code}' \
              "$PREVIEW_URL/health" || true)
            if [ "$health_status" = "200" ] && grep -q '"ok":true' /tmp/preview-health.json; then
              health_ok=true
              break
            fi
            echo "Preview health smoke attempt $attempt returned HTTP $health_status"
            cat /tmp/preview-health.json || true
            sleep 3
          done
          test "$health_ok" = "true"

          session_ok=false
          for attempt in $(seq 1 20); do
            status=$(curl --silent --show-error --output /tmp/preview-session.json --write-out '%{http_code}' \
              "$PREVIEW_URL/api/session" || true)
            if [ "$status" = "401" ] && grep -q '"authenticated":false' /tmp/preview-session.json; then
              session_ok=true
              break
            fi
            echo "Preview session smoke attempt $attempt returned HTTP $status"
            cat /tmp/preview-session.json || true
            sleep 3
          done
          test "$session_ok" = "true"

          adopt_ok=false
          for attempt in $(seq 1 20); do
            adopt_status=$(curl --silent --show-error --output /tmp/preview-adopt.json --write-out '%{http_code}' \
              -X POST "$PREVIEW_URL/api/auth/adopt-session" \
              -H 'content-type: application/json' \
              --data '{"access_token":"invalid","refresh_token":"invalid"}' || true)
            if [ "$adopt_status" = "401" ]; then
              adopt_ok=true
              break
            fi
            echo "Preview adopt-session smoke attempt $attempt returned HTTP $adopt_status"
            cat /tmp/preview-adopt.json || true
            sleep 3
          done
          test "$adopt_ok" = "true"
