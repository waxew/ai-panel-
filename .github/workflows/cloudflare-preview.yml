name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-preview.yml
      - package.json
      - pnpm-workspace.yaml
      - packages/shared/**
      - apps/cloudflare/**
      - apps/web/**

permissions:
  contents: read

concurrency:
  group: ai-panel-cloudflare-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @ai-panel/shared build

      - name: Build web app
        run: pnpm build:cloudflare

      - name: Deploy production
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ai-panel/cloudflare exec wrangler deploy

      - name: Smoke production
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            https://ai-panel-demo.bustling-larch.workers.dev/health \
            | tee /tmp/production-health.json
          grep -q '"ok":true' /tmp/production-health.json
          status=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/production-session.json --write-out '%{http_code}' \
            https://ai-panel-demo.bustling-larch.workers.dev/api/session)
          test "$status" = "401"
          grep -q '"authenticated":false' /tmp/production-session.json

      - name: Deploy temporary preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-panel/cloudflare exec wrangler deploy --temporary 2>&1 | tee /tmp/wrangler-preview.log
          preview_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -n 1)
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Smoke temporary preview
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/health" \
            | tee /tmp/preview-health.json
          grep -q '"ok":true' /tmp/preview-health.json
          status=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/preview-session.json --write-out '%{http_code}' "$PREVIEW_URL/api/session")
          test "$status" = "401"
          grep -q '"authenticated":false' /tmp/preview-session.json
          adopt_status=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/preview-adopt.json --write-out '%{http_code}' \
            -X POST "$PREVIEW_URL/api/auth/adopt-session" \
            -H 'content-type: application/json' \
            --data '{"access_token":"invalid","refresh_token":"invalid"}')
          test "$adopt_status" = "401"
