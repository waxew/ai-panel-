name: Cloudflare temporary preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-preview.yml
      - package.json
      - pnpm-workspace.yaml
      - apps/cloudflare/**
      - apps/web/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm build:cloudflare

      - name: Check Wrangler temporary deployment support
        run: |
          pnpm --filter @ai-panel/cloudflare exec wrangler --version
          pnpm --filter @ai-panel/cloudflare exec wrangler deploy --help | grep -- --temporary
