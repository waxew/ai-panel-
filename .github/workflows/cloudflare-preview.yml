name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-preview.yml
      - package.json
      - pnpm-workspace.yaml
      - packages/shared/**
      - apps/cloudflare/**
      - apps/web/**

permissions:
  contents: read

concurrency:
  group: ai-panel-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @ai-panel/shared build

      - name: Build web app
        run: pnpm build:cloudflare

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ai-panel/cloudflare exec wrangler deploy

      - name: Deploy temporary preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm --filter @ai-panel/cloudflare exec wrangler deploy --temporary
